appId: com.nexus.desktop
productName: Nexus
copyright: Copyright © 2026 Nexus
directories:
  buildResources: build
  output: release
# The renderer, preload and main are fully bundled by electron-vite, so no node_modules ship.
files:
  - out/**
  - package.json
npmRebuild: false
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Nexus-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  differentialPackage: true
# Code signing: unsigned by default. Set CSC_LINK (path/URL/base64 of a .pfx) and CSC_KEY_PASSWORD
# in the build environment and electron-builder signs Nexus.exe, the installer and the uninstaller.
# Azure Trusted Signing instead: `pnpm build:win:azure` (electron-builder.azure.yml). See SOT §13.
# Auto-update feed (SOT §13). Writes latest.yml + the .blockmap next to the installer and bakes
# app-update.yml into the app. The URL here is only a placeholder: clients use `updateUrl` from
# nexus.config.json, else <apiUrl>/updates/. Nothing is uploaded (`--publish never`); copy the files to the feed.
publish:
  - provider: generic
    url: https://nexus.yourcompany.internal/updates/
    useMultipleRangeRequest: false
