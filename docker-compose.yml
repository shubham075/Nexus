# Postgres + S3-compatible object storage + Redis + Mailpit (dev inbox) for local dev.
# MinIO images are no longer pullable from Docker Hub/quay, so SeaweedFS provides the S3 API (SOT D9).
# Host ports avoid the common 5432/5433/8333 to coexist with other local stacks.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: nexus-s3
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -volume.max=0
    ports:
      - "8334:8333"
    volumes:
      - s3data:/data

  # Optional: Socket.IO fan-out + shared presence across API instances (set REDIS_URL to use it).
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Dev inbox: catches every mail the API sends (SMTP :1026), web UI at http://localhost:8026.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: nexus-mailpit
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  pgdata:
  s3data:
