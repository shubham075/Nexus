# Nexus production stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Optional services are compose profiles (COMPOSE_PROFILES in .env.prod):
#   s3     bundled S3-compatible storage (SeaweedFS); omit when using AWS S3 / an external MinIO
#   redis  Redis for the API (REDIS_URL)
#   backup nightly pg_dump + media sync (deploy/backup)
# The web client (service web) is served at NEXUS_WEB_DOMAIN (default app.<NEXUS_DOMAIN>); the API stays at NEXUS_DOMAIN.
# Only the reverse proxy publishes ports. Postgres, S3, Redis and the API stay on the internal network.
# See deploy/README.md.
name: nexus-prod

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  TRUST_PROXY: "true"
  DATABASE_URL: ${DATABASE_URL:-postgresql://nexus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/nexus?schema=public}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
  # Email links (invite, verify, reset) open the web client.
  APP_URL: ${APP_URL:-https://${NEXUS_WEB_DOMAIN:-app.${NEXUS_DOMAIN}}}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies pending Prisma migrations, then exits. The API waits for it.
  migrate:
    image: ${NEXUS_API_IMAGE:-nexus-api:local}
    build: { context: .., dockerfile: apps/server/Dockerfile }
    command: ["migrate"]
    env_file: .env.prod
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ${NEXUS_API_IMAGE:-nexus-api:local}
    build: { context: .., dockerfile: apps/server/Dockerfile }
    restart: unless-stopped
    env_file: .env.prod
    environment: *api-env
    expose: ["4000"]
    volumes:
      - ${UPDATES_HOST_DIR:-./updates}:/app/updates:ro
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Web client: static renderer build (deploy/web). Reads the API origin at runtime, so the image is environment-neutral.
  web:
    image: ${NEXUS_WEB_IMAGE:-nexus-web:local}
    build: { context: .., dockerfile: deploy/web/Dockerfile }
    restart: unless-stopped
    environment:
      NEXUS_API_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    expose: ["8080"]
    logging: *logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?set NEXUS_DOMAIN}
      NEXUS_WEB_DOMAIN: ${NEXUS_WEB_DOMAIN:-app.${NEXUS_DOMAIN}}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    logging: *logging

  # Bundled S3 storage. MinIO no longer publishes images (SOT D9), so SeaweedFS provides the S3 API.
  s3:
    profiles: ["s3"]
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    # Writes an identity file so the S3 API requires the configured keys (SeaweedFS is open by default).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"nexus","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  backup:
    profiles: ["backup"]
    build: ./backup
    image: nexus-backup:local
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PGHOST: postgres
      PGUSER: nexus
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: nexus
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  s3data:
  redisdata:
  caddy_data:
  caddy_config:
